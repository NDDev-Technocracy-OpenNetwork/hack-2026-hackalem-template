product:
  purpose: 'Saint Tibo 2026 hackathon application template: TanStack Start, React,
    FastAPI and PostgreSQL; adapted from VibeStrap.'
  capabilities:
  - Bun 1.4.2 TypeScript frontend (React 19 + Vite) with generated API client
  - FastAPI backend with SQLAlchemy/Alembic on PostgreSQL, Better Auth, seeded demo
    data
  - 'hackathon lane workflow: feat/<issue>-<slug> -> <user> -> dev -> main'
  entrypoints:
  - change: what this repository is and what it may do
    path: .gds/repository.yaml
  - change: project conventions and workspace commands
    path: AGENTS.md
  - change: the domain, API and i18n conventions a feature touches
    path: docs/conventions.md
policy:
  profiles:
  - repository-default
  - organization-default
  rollout_ring: standard
